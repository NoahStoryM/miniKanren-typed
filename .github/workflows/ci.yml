name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bogdanp/setup-racket@v1.16
        with:
          version: "stable"
      - name: Install dependencies
        run: raco pkg install --auto --batch
      - name: Run tests
        run: raco test -p miniKanren-typed
